<style>:root{
  --bg:#f6f7fb; --card:#fff; --ink:#1e2433; --muted:#6b7280;
  --accent:#4f46e5; --line:#e5e7eb;
  --g1:#16a34a; --g2:#0d9488; --g3:#d97706; --g4:#9ca3af;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5}
.topbar h1{margin:0;font-size:1.15rem}
.meta{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.badge{background:var(--accent);color:#fff;font-size:.75rem;font-weight:700;
  padding:6px 12px;border-radius:999px;white-space:nowrap}
.digest{margin:12px 16px 0;padding:10px 14px;border-radius:12px;
  background:#eef2ff;border:1px solid #c7d2fe;font-size:.9rem}
.hidden{display:none!important}
.filters{margin:12px 16px 0;padding:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px}
.filters input[type=search]{width:100%;padding:10px 12px;font-size:1rem;
  border:1px solid var(--line);border-radius:10px;font-family:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:.85rem;background:#fff}
.checks label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
#results{padding:12px 16px 40px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px;font-size:1rem}
.card .sub{color:var(--muted);font-size:.82rem;margin:0 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:.72rem;padding:3px 10px;border-radius:999px;background:#f1f5f9;color:#475569}
.fit{font-weight:700;color:#fff}
.fit.f0{background:var(--g1)} .fit.f1{background:var(--g2)}
.fit.f2{background:var(--g3)} .fit.f3{background:var(--g4)}
.deadline{background:#fef3c7;color:#92400e}
.deadline.soon{background:#fee2e2;color:#991b1b}
.savebtn{margin-inline-start:auto;background:none;border:1px solid var(--line);
  border-radius:999px;padding:3px 12px;font-size:.75rem;cursor:pointer;font-family:inherit}
.savebtn.on{background:#fef9c3;border-color:#facc15}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center;padding:30px}}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:20px;position:relative}
@media(min-width:700px){.sheet{border-radius:16px}}
.x{position:absolute;top:10px;left:10px;border:none;background:#f1f5f9;
  border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1rem}
.sheet h2{margin:0 0 6px;font-size:1.15rem;padding-left:36px}
.why{margin:10px 0;padding:0;list-style:none}
.why li{font-size:.88rem;margin:4px 0;padding:6px 10px;border-radius:8px;background:#f0fdf4}
.why li.flag{background:#fef2f2}
.desc{white-space:pre-wrap;font-size:.9rem;color:#374151;
  max-height:40vh;overflow:auto;border:1px solid var(--line);
  border-radius:10px;padding:10px;margin:10px 0}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{display:inline-block;padding:10px 18px;border-radius:10px;text-decoration:none;
  font-size:.9rem;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
footer{padding:20px;text-align:center;color:var(--muted);font-size:.78rem}

.fit.fx{background:#b91c1c}
.fundok{background:#dcfce7;color:#166534}
.fundwarn{background:#fef3c7;color:#92400e}
.panel{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px}
.panel summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:.9rem}
.panel .pad{padding:0 14px 14px}
.instlist{margin:8px 0;padding-inline-start:18px;font-size:.85rem}
.instlist li{margin:4px 0}
.tabs{display:flex;gap:8px;padding:10px 16px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--ink)}
.tabs button.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.tabs .tcount{opacity:.75;font-size:.78rem}

/* iOS: lock background scroll when the modal sheet is open */
body.lock{overflow:hidden}

.more{display:block;margin:6px auto;padding:10px 22px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;cursor:pointer}
.pill.stale{background:#e5e7eb;color:#374151}
.card:focus-visible,.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--ink:#e6e8f0;--muted:#9aa3b5;--line:#2a3050}
.sheet,.row select{background:var(--card);color:var(--ink)}.pill{background:#232842;color:#c3c9d9}.desc{color:var(--ink)}
.digest{background:#1e2447;border-color:#33407a}.x{background:#232842;color:var(--ink)}.btn{background:var(--card);color:var(--ink)}}
.digest.warn{background:#fef3c7;border-color:#fcd34d;color:#78350f}
.tools{margin-top:10px}.tools .btn{padding:6px 12px;font-size:.78rem}
.tracker{display:grid;gap:8px;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:10px}
.tracker select,.tracker textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
#mDismiss{margin-top:6px}
</style>
</head>
<body>
<header class="topbar"><div><h1>Europe Opportunity Finder</h1><p id="metaLine" class="meta"></p></div><span class="badge">v2.3 • اتصال زنده</span></header>
<div id="digestBar" class="digest hidden"></div>
<nav class="tabs" id="tabs" role="tablist">
<button data-tab="phd" class="active" role="tab">🎓 دکتری <span class="tcount" id="cPhd"></span></button>
<button data-tab="job" role="tab">💼 فرصت‌های شغلی <span class="tcount" id="cJob"></span></button>
<button data-tab="master" role="tab">📚 مستر با فاند <span class="tcount" id="cMaster"></span></button>
<button data-tab="scholarship" role="tab">🏛️ بورس‌های دولتی و منطقه‌ای <span class="tcount" id="cSch"></span></button>
</nav>
<section class="filters">
<input id="q" type="search" placeholder="جست‌وجو در عنوان، سازمان یا متن آگهی…" aria-label="جست‌وجو">
<div class="row">
<select id="fGroup"><option value="">همه گروه‌های رشته‌ای</option></select>
<select id="fCountry"><option value="">همه کشورها</option></select>
<select id="fBand"><option value="">هر تناسبی</option><option>تناسب قوی</option><option>تناسب متوسط</option><option>تناسب ضعیف</option><option>حذف‌شده</option></select>
<select id="fSource"><option value="">همه منابع</option></select>
<select id="fSort"><option value="fit">مرتب‌سازی: تناسب</option><option value="priority">اولویت کشور + تناسب</option><option value="deadline">نزدیک‌ترین ددلاین</option><option value="newest">جدیدترین</option></select>
</div>
<div class="row checks">
<label title="دکتری: فقط استخدام با حقوق یا بورسیه کامل تأییدشده — آگهی‌های استخدامی دانشگاهی فقط با تصریح «بدون فاند» حذف می‌شوند"><input type="checkbox" id="cFunded" checked> فقط تأمین مالی تأییدشده</label>
<label><input type="checkbox" id="cPriority"> فقط کشورهای اولویت‌دار (FR/DK/DE)</label>
<label><input type="checkbox" id="cDeadline"> فقط دارای ددلاین</label>
<label><input type="checkbox" id="cDigest"> فقط برترین پیشنهادها</label>
<label><input type="checkbox" id="cSaved"> فقط ذخیره‌شده‌ها</label>
<label><input type="checkbox" id="cExcluded"> نمایش حذف‌شده‌های مهندسی‌محور</label>
<label><input type="checkbox" id="cExpired"> نمایش ددلاین‌گذشته‌ها</label>
</div>
</section>
<details class="panel" id="coveragePanel"><summary>📡 پوشش منابع و سیاست جست‌وجو</summary><div id="coverageBody" class="pad"></div></details>
<main id="results" aria-live="polite"></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="جزئیات آگهی"><div class="sheet"><button id="mClose" class="x" aria-label="بستن">✕</button><div id="mBody"></div></div></div>
<footer><p>آگهی‌ها مستقیماً از منابع رسمی خوانده می‌شوند؛ همیشه متن اصلی را در سایت منتشرکننده بررسی کنید.</p><p id="footMeta" class="meta"></p></footer>

<script>
/* Europe Opportunity Finder v2.3 — offline PWA frontend. Data: window.EOF_DATA (data/data.js) */
(function () {
"use strict";
const D = window.EOF_DATA || {};
D.postings = D.postings || []; D.groups = D.groups || []; D.digest = D.digest || { picks: [] }; D.meta = D.meta || {};
const $ = (id) => document.getElementById(id);
const FA_DAYS = ["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
const FA_MONTHS = ["ژانویه","فوریه","مارس","آوریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"];
const CC_FA = {GB:"بریتانیا",IE:"ایرلند",FR:"فرانسه",DE:"آلمان",NL:"هلند",BE:"بلژیک",ES:"اسپانیا",IT:"ایتالیا",PT:"پرتغال",SE:"سوئد",NO:"نروژ",DK:"دانمارک",FI:"فنلاند",AT:"اتریش",CH:"سوئیس",PL:"لهستان",CZ:"چک",HU:"مجارستان",GR:"یونان",HR:"کرواسی",RO:"رومانی",US:"آمریکا",CA:"کانادا",CN:"چین",JP:"ژاپن",KR:"کره جنوبی",AU:"استرالیا",EU:"اتحادیه اروپا"};
const ccName = (c) => CC_FA[c] || c || "نامشخص";
const BAND_CLASS = {"تناسب قوی":"f0","تناسب متوسط":"f1","تناسب ضعیف":"f2","حذف‌شده":"fx"};
const FUND_OK = new Set(D.funding_accepted || []);
const ELIG = D.eligibility_labels || {};
const PAGE = 50;

// storage never throws (private mode / corrupt values)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const pkey = (p) => p.source + "::" + p.external_id;
// LIVE-SHELL (Pages build has no embedded data): restore the last cached
// bundle so the app still opens offline after its first successful load.
if (!D.postings.length) {
  const _c = store.get("eof_cache", null);
  if (_c && _c.data && Array.isArray(_c.data.postings) && _c.data.postings.length) {
    ["postings", "groups", "digest", "meta", "version", "institutions",
     "priority_countries", "funding_accepted", "eligibility_labels"].forEach((k) => {
      if (_c.data[k] !== undefined) D[k] = _c.data[k];
    });
    D._fromCache = true;
  }
}
const byKey = new Map(D.postings.map((p) => [pkey(p), p]));
// saved = key -> snapshot, so a saved posting survives removal from fresh data
let saved = store.get("eof_saved2", null);
if (!saved || typeof saved !== "object" || Array.isArray(saved)) {
  saved = {};
  const old = store.get("eof_saved", []);
  (Array.isArray(old) ? old : []).forEach((k) => { saved[k] = byKey.get(k) || { _missing: true }; });
  store.set("eof_saved2", saved);
}
const persist = () => store.set("eof_saved2", saved);
const track = store.get("eof_track", {}), dismissed = store.get("eof_dismissed", {});
let jalali = store.get("eof_jalali", false);
const saveAux = () => { store.set("eof_track", track); store.set("eof_dismissed", dismissed); store.set("eof_jalali", jalali); };
const TRACK_ST = { prep: "در حال آماده‌سازی", sent: "ارسال‌شده", interview: "مصاحبه", rejected: "رد شد", accepted: "پذیرفته شد" };
const state = { tab: "phd", limit: PAGE };
const TAB_COUNT = { phd: "cPhd", job: "cJob", master: "cMaster", scholarship: "cSch" };

function parseDay(iso) { const d = new Date(iso + "T12:00:00"); return isNaN(d) ? null : d; }
// FIX: Intl with the Persian calendar can throw on older browsers —
// never let date formatting kill the whole app.
let JF = null;
try { JF = new Intl.DateTimeFormat("fa-IR-u-ca-persian", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); } catch (e) { JF = null; }
function faDate(iso) { if (!iso) return ""; const d = parseDay(iso); if (!d) return String(iso); return (jalali && JF) ? JF.format(d) : `${FA_DAYS[d.getDay()]} ${d.getDate()} ${FA_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function daysLeft(iso) { if (!iso) return null; const d = parseDay(iso); return d ? Math.ceil((d - Date.now()) / 86400000) : null; }
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function passes(p, x, tab) {

  // (search box, group, country...). Now it composes with all filters.
  if (x.onlySaved && !isSaved) return false;
  // stale snapshots (saved items removed from fresh data) only surface
  // in the "saved" view, never in the normal list
  if (p._stale && !x.onlySaved) return false;
  if (dismissed[pkey(p)]) return false;
  if (p.excluded && !x.showExcluded) return false;
  if (x.funded && !fundedPass(p)) return false;
  if (!x.showExpired && p.deadline && (daysLeft(p.deadline) ?? 0) < 0) return false;
  if (x.group && !(p.groups || []).includes(x.group)) return false;

  if (x.band && p.fit_band !== x.band) return false;

function dl(name, text, type) {

  // FIX (iOS): Safari ignores the download attribute — navigating to the
  // blob would lose app state. Open in a new tab so the Share sheet can save it.
  const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isiOS) { window.open(url, "_blank"); done(); return; }
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); done();
}

  }
  function applyLive(d) {
    D.postings = d.postings; D.groups = d.groups || []; D.digest = d.digest || { picks: [] };
    D.meta = d.meta || {}; D.version = d.version; D.institutions = d.institutions || {};
    D.priority_countries = d.priority_countries || [];
    D.funding_accepted = d.funding_accepted || D.funding_accepted;
    D.eligibility_labels = d.eligibility_labels || D.eligibility_labels;
    delete D._fromCache;
    byKey.clear(); D.postings.forEach((p) => byKey.set(pkey(p), p));
    // cache the bundle so the app opens offline after its first load
    const prev = store.get("eof_cache", null);
    if (!prev || !prev.data || !prev.data.meta || prev.data.meta.generated_at !== d.meta.generated_at) {
      store.set("eof_cache", { at: Date.now(), data: d });
    }
    $("metaLine").textContent = `${D.postings.filter((p) => !p.excluded).length} آگهی فعال • آخرین به‌روزرسانی: ${(D.meta.generated_at || "").slice(0, 10)}`;
    $("footMeta").textContent = `نسخه داده: ${D.version || "v2"} • منابع: ${(D.meta.sources || []).join("، ")}`;
    state.limit = PAGE; render();
  }
  function showNotice(html) {
    $("results").innerHTML = `<div class="empty" style="text-align:center;padding:48px 16px">${html}</div>`;
  }
  let loading = false;
  function load() {
    if (loading) return; loading = true; setBadge("🟡 در حال دریافت…");
    const s = document.createElement("script");
    let settled = false;
    const to = setTimeout(() => fin("timeout"), 15000);
    function fin(reason, data) {
      if (settled) return; settled = true; clearTimeout(to); loading = false;
      try { s.remove(); } catch (e) {}
      if (reason === "ok" && validLive(data)) { applyLive(data); setBadge("🟢 زنده"); }
      else {
        setBadge("⚪ آفلاین");
        badge.title = "دریافت داده زنده ناموفق بود (" + reason + ")";
        if (!D.postings.length) {
          showNotice(`⚪ اتصال به داده زنده برقرار نشد.<br><span class="meta">برای اولین بار به اینترنت نیاز است.</span><br><br><button class="btn primary" id="retryLive">🔄 تلاش مجدد</button>`);
          $("retryLive").onclick = load;
        }
      }
      window.__EOF_LIVE__ = undefined;
    }
    s.onload = () => fin("ok", window.__EOF_LIVE__);
    s.onerror = () => fin("network");
    s.async = true;
    s.src = LIVE_URL + (LIVE_URL.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(); // cache-buster
    document.head.appendChild(s);
  }
  refBtn.onclick = load;
  if (!D.postings.length) {
    showNotice(`🟡 در حال دریافت تازه‌ترین داده…<br><span class="meta">برای اولین بار به اینترنت نیاز است</span>`);
  }
  load(); // auto-fetch on every open
})();

/* single-file build: service worker omitted — the whole app is one local file */
})();

</script>
</body>
</html>
